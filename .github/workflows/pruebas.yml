name: Pruebas

on:
  push:
  pull_request:

jobs:
  flutter:
    name: App móvil (flutter test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || echo "::warning::flutter analyze reportó observaciones"
      - name: Pruebas
        run: flutter test --reporter expanded
